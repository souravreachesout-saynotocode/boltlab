<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>boltmem</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⚡</span>
        <span class="brand-name">boltmem</span>
      </div>

      <div class="controls">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search memory…"
          autocomplete="off"
          spellcheck="false"
        />
        <select id="project" class="select" aria-label="Project"></select>
        <select id="type" class="select" aria-label="Type">
          <option value="">All types</option>
          <option value="discovery">Discovery</option>
          <option value="change">Change</option>
          <option value="decision">Decision</option>
          <option value="issue">Issue</option>
        </select>
      </div>

      <div class="stats" id="stats" aria-live="polite"></div>
    </header>

    <main id="feed" class="feed" aria-busy="true">
      <p class="placeholder">Loading memory…</p>
    </main>

    <footer class="footer">
      <span id="footer-note"></span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
